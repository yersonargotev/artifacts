name: CI and production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: Invitation runtime test under port pressure
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: pnpm
      - uses: ./.github/actions/prepare-native
      - run: pnpm install --frozen-lockfile
      - name: Narrow the ephemeral port range so collisions are frequent
        run: sudo sysctl -w net.ipv4.ip_local_port_range="50000 50399" && cat /proc/sys/net/ipv4/ip_local_port_range
      - name: Run the invitation runtime test while the full suite runs
        run: |
          (for i in 1 2 3 4; do pnpm test > /dev/null 2>&1; done) &
          background=$!
          failures=0
          for i in $(seq 1 50); do
            if ! node --import tsx --test tests/invitation-runtime.test.ts > run.log 2>&1; then
              failures=$((failures+1))
              echo "::group::run $i failed"; grep -E 'REPRO|not ok|!==|Error' run.log | head -20; echo "::endgroup::"
            fi
          done
          echo "runs=$i failures=$failures"; test $failures -eq 0
          kill $background 2>/dev/null || true
