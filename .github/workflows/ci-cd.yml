name: CI and production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Check and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: checks-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:packages

  browser:
    name: Chrome proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm test:browser
      - run: node --import tsx tests/rest-cli.browser.proof.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: browser-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .test-artifacts/dashboard-desktop.png
            .test-artifacts/dashboard-mobile.png
            .test-artifacts/artifact-history-mobile.png
            .test-artifacts/publication-network.json
            .test-artifacts/rest-cli-panel.png
            .test-artifacts/rest-cli-publication.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  workers:
    name: Build Workers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:workers
      - run: |
          for service in auth mcp panel view; do
            pnpm deploy:worker "$service" --dry-run
          done
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workers-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/workers/auth/
            dist/workers/mcp/
            dist/workers/panel/
            dist/workers/view/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  production:
    name: Release production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, browser, workers]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    concurrency:
      group: artifacts-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.workers.outputs.artifact-id }}
          path: dist/workers
          merge-multiple: true
          digest-mismatch: error
      - run: pnpm release:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ARTIFACTS_RUNTIME_SECRETS: ${{ secrets.ARTIFACTS_RUNTIME_SECRETS }}
          GITHUB_TOKEN: ${{ github.token }}
