name: CI and production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    name: Seed the cache on ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - id: native
        uses: ./.github/actions/prepare-native
      - id: key
        run: |
          node -p 'process.report.getReport().header.glibcVersionRuntime'
          node -p 'JSON.stringify(require("./.native/libsql/provenance.json").target)'
          echo "key=native-libsql-$ImageOS-${{ runner.arch }}-glibc$(node -p 'process.report.getReport().header.glibcVersionRuntime')-${{ hashFiles('native/libsql/inputs.json', 'native/libsql/native-reset.patch', 'scripts/prepare-native.mjs') }}" >> "$GITHUB_OUTPUT"

  rebuild:
    name: Another glibc under the same ImageOS rebuilds
    needs: seed
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ImageOS: ubuntu24
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: 'echo "ImageOS=$ImageOS glibc=$(node -p "process.report.getReport().header.glibcVersionRuntime") seeded=${{ needs.seed.outputs.key }}"'
      - uses: ./.github/actions/prepare-native
      - run: node -p 'JSON.stringify(require("./.native/libsql/provenance.json").target)'

  mismatch:
    name: The mismatched cache still fails verification
    needs: seed
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      ImageOS: ubuntu24
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .native/libsql
          key: ${{ needs.seed.outputs.key }}
          fail-on-cache-miss: true
      - name: Verify the ubuntu-24.04 package on this glibc
        run: |
          if node scripts/prepare-native.mjs; then echo "::error::A provenance mismatch passed verification"; exit 1; fi
          echo "Verification rejected the mismatched package, as required"
