name: Public npm beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact beta version already committed in all three package manifests
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: artifacts-npm-beta
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.packages.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Match the requested version to committed manifests
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          assert(/^\d+\.\d+\.\d+-beta\.\d+$/.test(process.env.RELEASE_VERSION));
          for (const file of ['apps/cli/package.json', 'packages/client/package.json', 'packages/contracts/package.json']) {
            const manifest = JSON.parse(await readFile(file, 'utf8'));
            assert.equal(manifest.version, process.env.RELEASE_VERSION);
          }
          JS
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:packages
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm test:cli-first-use
      - run: pnpm exec tsx tests/rest-cli.browser.proof.ts
      - run: pnpm release:npm:check
      - id: packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: npm-beta-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/packages/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-beta
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: dist/packages/
          merge-multiple: true
          digest-mismatch: error
      - run: pnpm release:npm:check
      - run: pnpm release:npm:publish
        env:
          NPM_CONFIG_PROVENANCE: 'false'

  verify:
    needs: [prepare, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: dist/packages/
          merge-multiple: true
          digest-mismatch: error
      - run: pnpm verify:npm --report .test-artifacts/npm-beta/registry.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: npm-beta-verification-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-artifacts/npm-beta/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
