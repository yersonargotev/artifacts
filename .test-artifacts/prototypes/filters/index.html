<!doctype html>
<!--
PROTOTYPE, throwaway. Question: how should the library filter bar let an owner pick one project
when there are 3, 15, or 60 of them? Three structurally different variants on one page,
switchable with ?variant=A|B|C and the floating bar. Fake in-memory data, no panel code.
Agreed deviation from the prototype skill: a standalone HTML file instead of a variant on the
real Astro route, so it runs without building the panel.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTIPO · Filtros de proyecto</title>
<style>
:root {

  --accent-a2: color-mix(in srgb, var(--accent) 16%, transparent);
  --accent-a3: color-mix(in srgb, var(--accent) 32%, transparent);
  --warn-a1: color-mix(in srgb, var(--warn) 9%, transparent);
  --warn-a3: color-mix(in srgb, var(--warn) 30%, transparent);
  --ok-a1: color-mix(in srgb, var(--ok) 9%, transparent);
  --ok-a3: color-mix(in srgb, var(--ok) 30%, transparent);

  --sapphire: #74c7ec;
  --ok: #a6e3a1;
  --warn: #f9e2af;
  --danger: #f38ba8;
  --peach: #fab387;

  --pink: #f5c2e7;
  --sky: #89dceb;

  --maroon: #eba0ac;

  --shadow-1: 0 1px 2px #0006;
  --shadow-2: 0 16px 48px #000a;

}

[data-theme="light"] {

  --bg-raised: #ffffff;
  --bg-hover: #e4e7ee;
  --border-subtle: #dde0e8;
  --border: #ccd0da;
  --border-strong: #9ca0b0;
  --text: #2e3048;
  --text-2: #494c66;
  --text-3: #54576f;

  --sky: #045f86;

  --shadow-1: 0 1px 2px #4c4f6922;

[data-tone="peach"] { --tone: var(--peach); }
[data-tone="teal"] { --tone: var(--teal); }
[data-tone="pink"] { --tone: var(--pink); }
[data-tone="sky"] { --tone: var(--sky); }
[data-tone="lavender"] { --tone: var(--lavender); }
[data-tone="flamingo"] { --tone: var(--flamingo); }
[data-tone="sapphire"] { --tone: var(--sapphire); }

}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg-sunken); color: var(--text); font: 14px/1.4 var(--font-sans); }
button { font: inherit; color: inherit; }
#stage { position: relative; }
#stage.desktop { height: 100vh; }
#stage.mobile { width: 390px; height: 800px; margin: 16px auto 0; border: 1px solid var(--border-strong); border-radius: 26px; overflow: hidden; }
.app { display: grid; grid-template-columns: 56px minmax(0, 1fr); height: 100%; background: var(--bg); }

.mobile .rail { display: none; }

.token b { overflow: hidden; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }

.content { min-height: 0; overflow: auto; padding: 0 20px 24px; }

.tabs { display: flex; gap: 4px; flex: none; }

.reader .chip { height: 24px; padding: 0 8px; border-radius: var(--r-full); font-size: var(--text-xs); gap: 5px; }

/* Table */
table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
td, th { height: var(--row); padding: 0 10px; border-bottom: 1px solid var(--border-subtle); text-align: left; white-space: nowrap; }

/* Picker list, used by every variant in its own container */
.pick-search { display: flex; align-items: center; gap: 8px; height: 34px; margin: 0 0 6px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg-raised); }
.pick-search:focus-within { border-color: var(--accent); }

.pick { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 32px; padding: 4px 10px; border: 0; border-radius: var(--r-md); background: none; font-size: var(--text-sm); text-align: left; cursor: pointer; }
.mobile .pick { min-height: 44px; }
.pick:hover, .pick.active { background: var(--bg-hover); }
.pick .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick .label mark { background: none; color: var(--accent); font-weight: 700; }
.pick .count { color: var(--text-3); font-size: var(--text-xs); font-variant-numeric: tabular-nums; }
.pick[aria-current] { color: var(--accent); }
.pick[aria-current] .label { font-weight: 600; }
.pick .check { width: 14px; color: var(--accent); font-size: 12px; }
.pick-foot { display: flex; gap: 12px; padding: 8px 10px 2px; border-top: 1px solid var(--border-subtle); margin-top: 6px; color: var(--text-3); font-size: var(--text-2xs); }
.pick-empty { padding: 16px 10px; color: var(--text-3); font-size: var(--text-sm); }

/* Overlays */
.layer { position: absolute; inset: 0; z-index: 40; }
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.layer.clear .scrim { background: none; }
.pop { position: absolute; display: flex; flex-direction: column; width: 340px; max-height: 460px; padding: 8px; border: 1px solid var(--border-strong); border-radius: var(--r-lg); background: var(--bg-chrome); box-shadow: var(--shadow-2); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; max-height: 78%; padding: 8px 12px 16px; border-radius: 18px 18px 0 0; background: var(--bg-chrome); box-shadow: var(--shadow-2); }
.sheet::before { content: ""; align-self: center; width: 36px; height: 4px; margin: 2px 0 10px; border-radius: 2px; background: var(--border-strong); }
.sheet h2, .drawer h2 { margin: 0 4px 10px; font-size: var(--text-md); }
.drawer { position: absolute; top: 0; bottom: 0; left: 0; display: flex; flex-direction: column; width: 84%; padding: 14px 12px; background: var(--bg-chrome); box-shadow: var(--shadow-2); }

/* Variant A */
.combo { display: inline-flex; align-items: center; gap: 8px; max-width: 280px; height: 28px; padding: 0 8px 0 10px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--bg-raised); font-size: var(--text-sm); cursor: pointer; }
.combo:hover { border-color: var(--border-strong); }
.combo .k { color: var(--text-3); }
.combo .name { font-weight: 600; }
.combo.all .name { font-weight: 500; color: var(--text-2); }
.combo-clear { width: 24px; height: 24px; padding: 0; border: 0; border-radius: var(--r-sm); background: none; color: var(--text-3); cursor: pointer; }
.mobile .combo { max-width: none; height: 40px; width: 100%; }
.mobile .combo .name { max-width: none; flex: 1; text-align: left; }
.recent-strip { display: flex; gap: 4px; margin-left: 6px; }
.recent-strip .chip { height: 24px; padding: 0 8px; font-size: var(--text-xs); color: var(--text-3); }

/* Variant B */
.bwrap { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; margin: 0 -20px; }
.bwrap.collapsed { grid-template-columns: 48px minmax(0, 1fr); }
.bwrap > .bmain { padding: 0 20px; min-width: 0; }
.bwrap > .bmain .library-bar { margin: 0 -20px; }
.side { position: sticky; top: 0; display: flex; flex-direction: column; height: calc(100vh - 82px); padding: 10px 8px; border-right: 1px solid var(--border-subtle); background: color-mix(in srgb, var(--bg-chrome) 55%, var(--bg)); }
.side-head { display: flex; align-items: center; gap: 4px; margin: 0 2px 8px; }
.side-head h2 { flex: 1; margin: 0 0 0 4px; color: var(--text-2); font-size: var(--text-xs); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.seg { display: inline-flex; padding: 2px; border: 1px solid var(--border); border-radius: var(--r-sm); }
.seg button { height: 20px; padding: 0 6px; border: 0; border-radius: 4px; background: none; color: var(--text-3); font-size: var(--text-2xs); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--bg-hover); color: var(--text); }
.icon-btn { width: 26px; height: 26px; padding: 0; border: 0; border-radius: var(--r-sm); background: none; color: var(--text-3); cursor: pointer; }
.icon-btn:hover { background: var(--bg-hover); color: var(--text); }
.side .pick { min-height: 30px; }
.side .pick[aria-current] { background: var(--accent-a2); box-shadow: inset 3px 0 0 var(--accent); color: var(--text); }
.side .pick-search { height: 30px; }
.side-strip { display: flex; flex-direction: column; align-items: center; gap: 4px; overflow: auto; }
.strip-item { display: grid; place-items: center; flex: none; width: 32px; height: 32px; border: 0; border-radius: var(--r-md); background: none; cursor: pointer; font-size: 11px; font-weight: 700; color: var(--tone, var(--text-3)); }
.strip-item:hover { background: var(--bg-hover); }
.strip-item[aria-current] { background: var(--accent-a2); box-shadow: inset 3px 0 0 var(--accent); }

.bmobile-btn .name { flex: 1; max-width: none; text-align: left; font-weight: 600; }

/* Variant C */
.chips { display: flex; flex: 1 1 320px; gap: 4px; min-width: 0; }
.chips-scroll { display: flex; gap: 4px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.mobile .chips, .rfilters .chips { flex: none; max-width: 100%; }
.chips > .chip { flex: none; }
.mobile .library-bar > * { min-width: 0; max-width: 100%; }
.chip.more { border-style: dashed; border-color: var(--border); color: var(--text-2); }
.chip-clear { width: 28px; padding: 0; justify-content: center; }

/* Reader */
.reader { display: grid; grid-template-columns: 340px minmax(0, 1fr); height: 100%; margin: 0 -20px -24px; }
.reader.with-strip { grid-template-columns: 48px 320px minmax(0, 1fr); }
.reader.with-side { grid-template-columns: 220px 320px minmax(0, 1fr); }
.mobile .reader, .mobile .reader.with-strip, .mobile .reader.with-side { grid-template-columns: 1fr; grid-template-rows: 44% 1fr; margin: 0; }
.rlist { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border-subtle); background: var(--bg-chrome); }
.rfilters { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--border-subtle); }
.rfilters .tabs { overflow-x: auto; }
.rfilters .tabs button { height: 24px; padding: 0 8px; border-radius: var(--r-full); font-size: var(--text-xs); }
.rrows { flex: 1; min-height: 0; overflow: auto; }
.ritem { display: grid; grid-template-columns: minmax(0, 1fr) auto; padding: 8px 14px; border-bottom: 1px solid var(--border-subtle); font-size: var(--text-sm); }
.ritem:first-child { background: var(--accent-a1); }
.ritem b { overflow: hidden; font-weight: 550; text-overflow: ellipsis; white-space: nowrap; }
.ritem time, .ritem small { color: var(--text-3); font-size: var(--text-2xs); }
.rgroup { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 14px; border-bottom: 1px solid var(--border-subtle); background: var(--bg); color: var(--text-2); font-size: var(--text-xs); font-weight: 600; }
.rpane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.rpane header { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border-bottom: 1px solid var(--border-subtle); font-weight: 600; }
.rpane .frame { flex: 1; margin: 16px; border: 1px solid var(--border); border-radius: var(--r-md); background: repeating-linear-gradient(135deg, var(--bg-raised) 0 12px, var(--bg) 12px 24px); display: grid; place-items: center; color: var(--text-3); }
.reader .side { height: auto; min-height: 0; }

/* Prototype chrome, deliberately off-brand */
.proto { position: fixed; z-index: 100; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 999px; background: #111; color: #fff; box-shadow: 0 8px 30px #0008; font: 12px var(--font-sans); }
.proto button { height: 28px; padding: 0 10px; border: 0; border-radius: 999px; background: #2a2a2a; color: #fff; cursor: pointer; }

.notes h3 { margin: 0 0 6px; font-size: 13px; } .notes ul { margin: 0 0 10px; padding-left: 18px; } .notes li { margin: 3px 0; }

<script>
// ---------- Fake data (deterministic) ----------
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const NAMES = ['artifacts-panel', 'Onboarding', 'Informe trimestral Q3', 'Wiki interna', 'Pagos', 'Rediseño del flujo de registro para clientes empresariales', 'Docs API pública', 'Investigación de usuarios 2026', 'Marca', 'Experimentos de precios', 'Landing primavera', 'Soporte', 'Roadmap', 'Comunidad', 'Diseño de búsqueda',
  'Cliente Acme · propuesta', 'Cliente Globex · auditoría', 'Migración a Turso', 'Charlas y talleres', 'Notas de lanzamiento', 'Accesibilidad', 'Métricas de crecimiento', 'Plantillas de correo', 'Estrategia de contenido para redes sociales del segundo semestre', 'Seguridad', 'App móvil', 'Facturación', 'Legal y privacidad', 'Equipo de datos', 'Retrospectivas',
  'Cliente Initech · integración', 'Cliente Umbrella', 'Hackathon', 'Formación interna', 'Prototipos', 'Kit de prensa', 'Partners', 'Analítica de producto', 'Recetas', 'Viaje a Lisboa', 'Tesis', 'Curso de TLA+', 'Benchmarks', 'Ideas sueltas', 'Portafolio',
  'Cliente Hooli · rediseño', 'Cliente Stark · dashboard', 'Ventas LATAM', 'Ventas EMEA', 'Encuestas NPS', 'OKR 2027', 'Mantenimiento', 'Infraestructura', 'Observabilidad y alertas', 'Experimentos con IA', 'Documentación de diseño', 'Iconografía', 'Ilustraciones', 'Videos', 'Archivo'];
const TONES = ['peach', 'teal', 'pink', 'sky', 'lavender', 'flamingo', 'sapphire', 'maroon'];
const NOUNS = ['Resumen', 'Diagrama', 'Propuesta', 'Checklist', 'Informe', 'Mockup', 'Guía', 'Comparativa', 'Plan', 'Notas', 'Tablero', 'Borrador', 'Especificación', 'Encuesta'];
const STATES = [['published', 'Publicado', 'var(--ok)'], ['pending', 'Con cambios', 'var(--warn)'], ['draft', 'Borrador', 'var(--text-3)']];
function buildData(n) {
  const r = rng(n * 7919);
  const projects = NAMES.slice(0, n).map((name, i) => ({ name, tone: TONES[i % TONES.length] }));
  const artifacts = [];
  const sizes = projects.map((_, i) => Math.max(1, Math.round(70 / Math.pow(1 + ((i * 37) % n), 1.15) * (0.6 + r()))));
  const owners = [...projects.map((p, i) => ({ p, size: sizes[i] })), { p: null, size: 9 }];
  for (const { p, size } of owners) for (let j = 0; j < size; j++) {
    const s = r(); const st = s < 0.6 ? STATES[0] : s < 0.78 ? STATES[1] : STATES[2];
    artifacts.push({ title: NOUNS[Math.floor(r() * NOUNS.length)] + ' ' + (p ? p.name.split(' ')[0].toLowerCase() : 'suelto') + ' ' + (j + 1), slug: 'a-' + Math.floor(r() * 1e6).toString(36), project: p ? p.name : null, state: st, hours: Math.floor(Math.pow(r(), 2.2) * 24 * 90), rev: 1 + Math.floor(r() * 9) });
  }
  for (const p of projects) { const mine = artifacts.filter((a) => a.project === p.name); p.count = mine.length; p.hours = Math.min(...mine.map((a) => a.hours)); }
  return { projects, artifacts, unfiled: artifacts.filter((a) => !a.project).length };
}

// ---------- State ----------

// ---------- Helpers ----------
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const fold = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

const byRecent = (a, b) => a.hours - b.hours;
const byAlpha = (a, b) => a.name.localeCompare(b.name, 'es');
function highlight(label, q) {
  if (!q) return esc(label);
  const i = fold(label).indexOf(fold(q));
  return i < 0 ? esc(label) : esc(label.slice(0, i)) + '<mark>' + esc(label.slice(i, i + q.length)) + '</mark>' + esc(label.slice(i + q.length));
}
const ALL = () => ({ kind: 'all', label: 'Todos los proyectos', count: D.artifacts.length });
const UNFILED = () => ({ kind: 'unfiled', label: 'Sin proyecto', count: D.unfiled });
const PROJ = (p) => ({ kind: 'project', name: p.name, label: p.name, count: p.count, tone: p.tone, hours: p.hours });
function matches(q) { const f = fold(q); return [...D.projects.filter((p) => fold(p.name).includes(f)).sort((a, b) => fold(a.name).indexOf(f) - fold(b.name).indexOf(f) || byRecent(a, b)).map(PROJ), ...(fold('Sin proyecto').includes(f) ? [UNFILED()] : [])]; }
function scoped() { return D.artifacts.filter((a) => S.scope.kind === 'all' || (S.scope.kind === 'unfiled' ? !a.project : a.project === S.scope.name)); }
function visible() { const f = fold(S.q); return scoped().filter((a) => (S.status === 'all' || a.state[0] === S.status) && (!f || fold(a.title).includes(f))).sort((a, b) => a.hours - b.hours).slice(0, 25); }

// ---------- Picker (list + keyboard), each variant mounts it in its own container ----------
function pickItem(item, q, i) {

// Wires the search input inside root: typing re-renders only the list, arrows move the active row, Enter picks.
function mountPicker(root, groupsFor) {
  const input = root.querySelector('.pick-search input'); const list = root.querySelector('.pick-list');
  let active = 0;
  const paint = () => { list.innerHTML = pickGroups(groupsFor(input ? input.value.trim() : ''), input ? input.value.trim() : ''); const items = list.querySelectorAll('.pick'); active = Math.min(active, items.length - 1); items.forEach((el, i) => el.classList.toggle('active', i === active)); items[active]?.scrollIntoView({ block: 'nearest' }); };
  paint();
  if (!input) return;
  input.addEventListener('input', () => { active = 0; paint(); });
  input.addEventListener('keydown', (e) => {
    const items = list.querySelectorAll('.pick');
    if (e.key === 'ArrowDown') { e.preventDefault(); active = (active + 1) % items.length; paint(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = (active - 1 + items.length) % items.length; paint(); }
    else if (e.key === 'Enter') { e.preventDefault(); items[active]?.click(); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); if (input.value) { input.value = ''; paint(); } else close(); }
  });

}

  overlay() {
    if (S.overlay !== 'more') return '';
    const body = '<div class="pick-search"><span style="color:var(--text-3)">⌕</span><input placeholder="Buscar en ' + D.projects.length + ' proyectos…" aria-label="Buscar proyecto"></div><div class="pick-list"></div><div class="pick-foot"><span>Tip: escribe <kbd>proyecto:</kbd> en la búsqueda</span></div>';
    if (S.device === 'mobile') return '<div class="layer"><div class="scrim" data-act="close"></div><div class="sheet" data-picker><h2>Todos los proyectos</h2>' + body + '</div></div>';
    const btn = document.querySelector('.chip.more').getBoundingClientRect(); const st = document.getElementById('stage').getBoundingClientRect();
    return '<div class="layer clear"><div class="scrim" data-act="close"></div><div class="pop" data-picker style="top:' + (btn.bottom - st.top + 6) + 'px;left:' + Math.min(btn.left - st.left, st.width - 352) + 'px">' + body + '</div></div>';
  },
  key() { if (document.querySelector('.chip.more')) open('more'); else document.querySelector('.search input').focus(); },
  notes: ['<h3>Idea</h3><ul><li>Se mantienen los chips de hoy, pero solo los 5 proyectos más recientes (3 en lectura y en móvil). El proyecto elegido siempre se ve aunque no sea reciente, y el resto queda detrás de «+N más».</li><li>Para el teclado: en la búsqueda de arriba, <code>proyecto:</code> abre sugerencias y la elección queda como un token. Prueba escribir <kbd>proyecto:pag</kbd>. En la versión real, ⌘K ya lista proyectos.</li><li>Es el cambio más chico respecto del panel actual.</li></ul>',
    '<h3>Sin JavaScript</h3><ul><li>Los chips son enlaces GET. «+N más» es un <code>details</code> con la lista completa. El token se puede resolver en el servidor: <code>q=proyecto:pagos</code> se traduce a <code>project=Pagos</code>.</li></ul>',
    '<h3>Móvil</h3><ul><li>Una fila de chips con desplazamiento lateral y «+N más» como hoja inferior.</li></ul>',
    '<h3>Preguntas abiertas</h3><ul><li>¿Los chips deberían mantener una posición estable? Ordenarlos por actividad hace que cambien de lugar.</li><li>¿El token debe vivir en la búsqueda (mezcla dos conceptos) o solo en ⌘K?</li></ul>'],
};
const V = { A, B, C };

// ---------- Search box (variant C adds the proyecto: token) ----------
function searchBox() {
  const token = S.variant === 'C' && S.scope.kind !== 'all' ? '<span class="token"><em>proyecto:</em><b>' + esc(scopeLabel()) + '</b><button data-scope="all" title="Quitar">✕</button></span>' : '';
  const ph = S.variant === 'C' ? 'Buscar… (proyecto: para filtrar)' : 'Buscar artefactos';
  return '<label class="search"><span style="color:var(--text-3)">⌕</span>' + token + '<input id="q" value="' + esc(S.q) + '" placeholder="' + ph + '" autocomplete="off"><span class="kbd">⌘K</span><div class="suggest" hidden></div></label>';
}
function wireSearch() {
  const input = document.getElementById('q'); const box = input.parentElement.querySelector('.suggest'); let active = 0, items = [];
  const tokenQuery = () => S.variant === 'C' ? /(?:^|\s)proyecto:(\S*)$/i.exec(input.value) : null;
  const paint = () => {
    const m = tokenQuery(); if (!m) { box.hidden = true; return; }
    items = (m[1] ? matches(m[1]) : [...D.projects].sort(byRecent).map(PROJ)).slice(0, 8); active = Math.min(active, Math.max(0, items.length - 1));
    box.hidden = false; box.innerHTML = '<div class="pick-title">proyecto:</div>' + (items.length ? items.map((it, i) => pickItem(it, m[1], i)).join('') : '<p class="pick-empty">Sin coincidencias</p>');
    box.querySelectorAll('.pick').forEach((el, i) => el.classList.toggle('active', i === active));
  };
  const strip = () => input.value.replace(/(?:^|\s)proyecto:\S*$/i, '').trim();
  input.addEventListener('input', () => { active = 0; paint(); });
  box.addEventListener('mousedown', (e) => { const b = e.target.closest('.pick'); if (b) { e.preventDefault(); S.q = strip(); input.value = S.q; } });
  input.addEventListener('keydown', (e) => {
    if (!box.hidden && items.length) {
      if (e.key === 'ArrowDown') { e.preventDefault(); active = (active + 1) % items.length; return paint(); }
      if (e.key === 'ArrowUp') { e.preventDefault(); active = (active - 1 + items.length) % items.length; return paint(); }
      if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); const it = items[active]; S.q = strip(); S.scope = it.kind === 'project' ? { kind: 'project', name: it.name } : { kind: it.kind }; render(); document.getElementById('q').focus(); return; }
    }
    if (e.key === 'Backspace' && !input.value && S.variant === 'C' && S.scope.kind !== 'all') { S.scope = { kind: 'all' }; render(); document.getElementById('q').focus(); return; }
    if (e.key === 'Escape') { box.hidden = true; input.blur(); }
    if (e.key === 'Enter') { S.q = input.value.trim(); render(); }
  });
}

// ---------- Render ----------
function render() {
  document.documentElement.dataset.theme = S.theme;
  const v = V[S.variant]; const stage = document.getElementById('stage'); stage.className = S.device;
  const reader = S.mode === 'reader';
  const top = reader ? '<span class="back">← Biblioteca</span><h1>Modo lectura</h1>' + (S.device === 'desktop' ? searchBox() : '') : '<h1>Biblioteca</h1>' + searchBox();
  const hints = reader ? '<span>j k siguiente</span><span>g proyecto</span><span>esc volver</span>' : '<span>j k mover</span><span>g proyecto</span><span>↵ leer</span>';
  stage.innerHTML = '<div class="app"><nav class="rail"><i class="brand"></i><i class="' + (reader ? '' : 'on') + '"></i><i></i><i class="' + (reader ? 'on' : '') + '"></i></nav><div class="main"><header class="top">' + top + '</header><main class="content' + (reader ? ' reader-host' : '') + '">' + (reader ? v.reader() : v.library()) + '</main><footer class="statusbar"><span>' + D.artifacts.length + ' artefactos · ' + D.projects.length + ' proyectos</span><span class="url">' + esc(panelUrl()) + '</span><span class="hints">' + hints + '</span></footer></div></div><div id="layer"></div>';
  if (reader) stage.querySelector('.content').style.overflow = 'hidden';
  v.after?.();
  if (document.getElementById('q')) wireSearch();
  renderOverlay(); renderProto(); syncUrl();
}
function renderOverlay() { const host = document.getElementById('layer'); host.innerHTML = V[S.variant].overlay(); const p = host.querySelector('[data-picker]'); if (p) mountPicker(p, V[S.variant].groups); }
function open(kind) { S.overlay = kind; renderOverlay(); }
function close() { S.overlay = null; renderOverlay(); }
function renderProto() {
  const keys = Object.keys(VARIANTS);
  const seg = (field, opts) => opts.map(([val, label]) => '<button data-proto="' + field + '" data-val="' + val + '" class="' + (String(S[field]) === String(val) ? 'on' : '') + '">' + label + '</button>').join('');
  document.getElementById('proto').innerHTML = '<div class="proto"><button data-proto-step="-1">←</button><span class="label">' + S.variant + ' · ' + VARIANTS[S.variant] + '</span><button data-proto-step="1">→</button><span class="sep"></span>' + seg('n', [[3, '3'], [15, '15'], [60, '60']]) + '<span class="sep"></span>' + seg('device', [['desktop', 'Escritorio'], ['mobile', 'Móvil']]) + '<span class="sep"></span>' + seg('mode', [['library', 'Biblioteca'], ['reader', 'Lectura']]) + '<span class="sep"></span><button data-proto-theme>' + (S.theme === 'dark' ? '☾' : '☀') + '</button><button data-proto-notes class="' + (S.notes ? 'on' : '') + '">Notas</button></div>' + (S.notes ? '<div class="notes">' + V[S.variant].notes.join('') + '</div>' : '');
  void keys;
}

// ---------- Events ----------
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-scope],[data-status],[data-act],[data-proto],[data-proto-step],[data-proto-theme],[data-proto-notes]'); if (!t) return;
  if (t.dataset.scope) { S.scope = t.dataset.scope === 'project' ? { kind: 'project', name: t.dataset.name } : { kind: t.dataset.scope }; S.overlay = null; S.status = 'all'; return render(); }
  if (t.dataset.status) { S.status = t.dataset.status; return render(); }
  const act = t.dataset.act;
  if (act === 'open-picker') return open('picker');
  if (act === 'open-more') return open('more');
  if (act === 'open-drawer') return open('drawer');
  if (act === 'close') return close();
  if (act === 'collapse' || act === 'expand') { S.sideCollapsed = act === 'collapse'; return render(); }
  if (act === 'sort-recent' || act === 'sort-alpha') { S.sideSort = act.slice(5); return render(); }
  if (t.dataset.protoStep) { const k = Object.keys(VARIANTS); S.variant = k[(k.indexOf(S.variant) + Number(t.dataset.protoStep) + k.length) % k.length]; S.overlay = null; return render(); }
  if (t.dataset.proto) { const f = t.dataset.proto; S[f] = f === 'n' ? Number(t.dataset.val) : t.dataset.val; if (f === 'n') { D = buildData(S.n); S.scope = { kind: 'all' }; } S.overlay = null; return render(); }
  if (t.hasAttribute('data-proto-theme')) { S.theme = S.theme === 'dark' ? 'light' : 'dark'; return render(); }
  if (t.hasAttribute('data-proto-notes')) { S.notes = !S.notes; return renderProto(); }
});
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const typing = e.target.closest('input, textarea, [contenteditable]');
  if (e.key === 'Escape' && S.overlay) return close();
  if (typing || S.overlay) return;
  if (e.key === 'g') { e.preventDefault(); return V[S.variant].key(); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { const k = Object.keys(VARIANTS); S.variant = k[(k.indexOf(S.variant) + (e.key === 'ArrowRight' ? 1 : -1) + 3) % 3]; render(); }
});
window.addEventListener('resize', () => S.overlay && renderOverlay());
render();
</script>
</body>
</html>
